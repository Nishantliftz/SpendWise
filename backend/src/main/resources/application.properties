spring.application.name=spendwise-backend
server.port=8080

# ── Database ─────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spendwise_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:your_mysql_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ── JWT ──────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:SpendWise2024SecretKeyForJWTTokenGenerationAndValidationMustBe256BitsLongEnough}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── CORS ─────────────────────────────────────────────────────
# In production set: ALLOWED_ORIGINS=https://your-app.vercel.app
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── Logging ──────────────────────────────────────────────────
logging.level.com.spendwise=INFO
logging.level.org.springframework.security=WARN
