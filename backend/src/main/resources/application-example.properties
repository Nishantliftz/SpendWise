# =============================================================
#  SpendWise Backend – application.properties TEMPLATE
#  Copy this file to application.properties and fill in your values.
#  NEVER commit application.properties with real secrets to Git.
# =============================================================

spring.application.name=spendwise-backend
server.port=8080

# ── Database ─────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/spendwise_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=YOUR_MYSQL_USERNAME
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
# Use 'update' for development; use 'validate' or 'none' for production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ── JWT ──────────────────────────────────────────────────────
# Generate a strong random secret (minimum 32 chars) for production
jwt.secret=REPLACE_WITH_A_STRONG_RANDOM_SECRET_KEY_AT_LEAST_256_BITS
jwt.expiration=86400000

# ── Logging ──────────────────────────────────────────────────
logging.level.com.spendwise=INFO
